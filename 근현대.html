<!doctype html>
<html lang="ko" data-skin="white" data-look="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모두의 한국사 — 근현대</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var L=localStorage.getItem("hs-look");if(L)document.documentElement.dataset.look=L}catch(e){}</script>
<link rel="stylesheet" href="css/base.css?v=4488879af9">
<link rel="stylesheet" href="css/timeline.css?v=375c6336db">
<link rel="stylesheet" href="css/geundae.css?v=e5957fcd5c">
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html"><b>모두의 <em>한국사</em></b><small>근현대</small></a>
    <nav class="nav">
      <a href="연표.html">연표</a>
      <a href="계보.html">왕조 계보</a>
      <a href="근현대.html" aria-current="page">근현대</a>
    </nav>
    <div class="spacer"></div>
    <div class="look"><span>디자인</span>
      <div class="seg" id="lookseg" role="group" aria-label="디자인 고르기">
        <button data-l="paper">종이</button>
        <button data-l="night">밤</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div><h1>근현대 — <em>네 장</em>으로 끊어 보기</h1>
      <p class="lead">한 장에 다 담지 않았습니다. <b>시기마다 한 장</b>씩 넘겨 보고, 장마다
        <b>지도(어디서) · 줄기(어떻게 이어졌나) · 인물(누가)</b> 세 가지로 볼 수 있습니다.
        얼굴 사진은 교과서에 실린 것만 씁니다.</p></div>
    <div class="legend">
      <span><span class="qq">기출 7</span>&nbsp;= 출제 횟수(대면 회차)</span>
      <span>지도 바탕 Natural Earth(공공 영역)</span>
    </div>
  </div>

  <div class="chaps" id="chaps"></div>
  <div class="cover" id="cover"></div>

  <div class="gd-bar">
    <div class="seg" id="views" role="group" aria-label="보기 고르기">
      <button data-v="map">지도</button>
      <button data-v="stem">줄기</button>
      <button data-v="people">인물</button>
    </div>
    <div class="kinds" id="kinds"></div>
  </div>

  <div id="stage"></div>

  <div class="chapnav">
    <button id="prev">← 이전 장</button>
    <button id="next">다음 장 →</button>
  </div>
</main>

<script src="js/geundae.js?v=9c17778130"></script>
<script>
(function(){
  const GD = window.GD, $ = s => document.querySelector(s);
  const 에스 = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  const 갈래색 = {"무장 투쟁":"var(--f-정치)", "의열":"var(--f-정치)", "의열·무장":"var(--f-정치)",
    "의병 계열":"var(--f-정치)", "임시 정부":"var(--f-대외)", "외교":"var(--f-대외)", "외교·자금":"var(--f-대외)",
    "실력 양성":"var(--f-경제)", "기지 건설":"var(--f-경제)", "사회 운동":"var(--f-사회)",
    "민족 유일당":"var(--f-사회)", "학술·문화":"var(--f-문화)", "건국 준비":"var(--f-대외)"};
  const 색 = k => 갈래색[k] || "var(--ink-3)";
  const 줄기색 = {"신민회 줄기":"var(--f-경제)", "임시 정부 줄기":"var(--f-대외)", "의열·좌파 줄기":"var(--f-정치)",
    "만주 무장 줄기":"var(--f-정치)", "국내 비밀 결사 줄기":"var(--f-정치)",
    "국내 실력 양성·사회 운동 줄기":"var(--f-사회)", "학술·문화 줄기":"var(--f-문화)",
    "국외 한인 사회 줄기":"var(--f-경제)", "건국 준비 줄기":"var(--f-대외)"};

  const 사람표 = Object.fromEntries(GD.사람.map(p=>[p.이름, p]));
  const 시기표 = Object.fromEntries(GD.시기.map((t,i)=>[t.키, {...t, 번호:i+1}]));
  const 장들 = GD.시기.map(t=>t.키);
  let 장 = "1910", 보기 = "map", 갈래끔 = new Set(), 고른곳 = null, 고른단체 = null;

  /* 갈래 그림 — 단체 성격을 기호로. 선 몇 개로 그린 것이라 사실을 지어내지 않는다. */
  const 갈래그림 = {
    무장: `<path d="M12 2 3 5v7c0 5 3.8 8.6 9 10 5.2-1.4 9-5 9-10V5l-9-3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v9M8.5 11.5h7" stroke="currentColor" stroke-width="1.6"/>`,
    의열: `<circle cx="11" cy="14" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.4 9.6l2.6-2.6M18 7l1.2-3 2.8 1-2 2.6" fill="none" stroke="currentColor" stroke-width="1.6"/>`,
    정부: `<path d="M3 20h18M4 20V9m4 11V9m4 11V9m4 11V9m4 11V9M2.5 9L12 3.5 21.5 9z" fill="none" stroke="currentColor" stroke-width="1.6"/>`,
    양성: `<path d="M4 4.5h6a2 2 0 012 2V20a2.6 2.6 0 00-2-1.4H4zM20 4.5h-6a2 2 0 00-2 2V20a2.6 2.6 0 012-1.4h6z" fill="none" stroke="currentColor" stroke-width="1.6"/>`,
    사회: `<circle cx="8" cy="8.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="8.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 19c0-3 2.6-4.6 5-4.6s5 1.6 5 4.6M13 19c.2-2.6 2.6-4.2 5-4.2S23 16.4 23 19" fill="none" stroke="currentColor" stroke-width="1.6"/>`,
    문화: `<path d="M5 19c2-.4 3-1.6 3-3.4 0-1.6 1-2.6 2.4-2.6M8 15.6 17.8 5.8a2 2 0 012.8 2.8L10.8 18.4" fill="none" stroke="currentColor" stroke-width="1.6"/>`,
  };
  const 갈래키 = k => /무장|의병/.test(k) ? "무장" : /의열/.test(k) ? "의열"
      : /임시|외교|건국/.test(k) ? "정부" : /실력|기지/.test(k) ? "양성"
      : /사회|유일당/.test(k) ? "사회" : "문화";
  const 그림 = k => `<svg class="kico" viewBox="0 0 24 24" aria-hidden="true">${갈래그림[갈래키(k)]}</svg>`;

  /* 얼굴 — 사진이 없으면 얼굴 없는 실루엣 기호를 쓴다(초상을 지어내지 않는다) */
  const 실루엣 = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.2c-3.3 0-9.8 1.7-9.8 4.9v2.7h19.6v-2.7c0-3.2-6.5-4.9-9.8-4.9z"/></svg>`;
  const 얼굴칩 = n => { const p = 사람표[n];
    const 안 = p && p.얼굴 && p.얼굴.length ? `<img src="assets/person/${p.얼굴[0].f}" alt="${에스(n)}" loading="lazy"
        onerror="this.parentNode.innerHTML='${실루엣.replace(/'/g,"&#39;")}'">` : 실루엣;
    return `<span class="face" data-p="${에스(n)}"><span class="im">${안}</span>${에스(n)}</span>`; };
  const 얼굴알 = n => { const p = 사람표[n];
    const 안 = p && p.얼굴 && p.얼굴.length ? `<img src="assets/person/${p.얼굴[0].f}" alt="${에스(n)}" loading="lazy">` : 실루엣;
    return `<span class="im" title="${에스(n)}">${안}</span>`; };

  function 옷(l){
    document.documentElement.dataset.look = l;
    document.documentElement.dataset.skin = l==="night" ? "" : "white";
    [...$("#lookseg").children].forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.l===l)));
    try{ localStorage.setItem("hs-look", l); }catch(e){}
    머리높이();
  }
  $("#lookseg").addEventListener("click", ev=>{ const b=ev.target.closest("button"); if(b) 옷(b.dataset.l); });
  function 머리높이(){
    document.documentElement.style.setProperty("--hh",
      Math.round(document.querySelector(".top").getBoundingClientRect().height) + "px");
  }
  addEventListener("resize", 머리높이);
  if(document.fonts) document.fonts.ready.then(머리높이);

  /* ── 장 고르개 ── */
  $("#chaps").innerHTML = GD.시기.map((t,i)=>
    `<button data-a="${t.키}" aria-pressed="${t.키===장}"><em>${i+1}장</em><b>${t.이름}</b><small>${t.설명}</small></button>`).join("");
  $("#chaps").addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(b) 장바꾸기(b.dataset.a);
  });
  $("#views").innerHTML = [...$("#views").children].map(b=>b.outerHTML).join("");
  $("#views").addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(!b) return;
    보기 = b.dataset.v; 그리기();
  });
  $("#prev").addEventListener("click", ()=>{ const i = 장들.indexOf(장); if(i>0) 장바꾸기(장들[i-1]); });
  $("#next").addEventListener("click", ()=>{ const i = 장들.indexOf(장); if(i<장들.length-1) 장바꾸기(장들[i+1]); });
  function 장바꾸기(k){
    장 = k; 고른곳 = null; 고른단체 = null;
    [...$("#chaps").children].forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.a===장)));
    그리기();
    const hh = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hh")) || 110;
    scrollTo({top: Math.max(0, $("#chaps").getBoundingClientRect().top + scrollY - hh - 12), behavior:"smooth"});
  }

  const 갈래들 = [...new Set(GD.단체.map(t=>t.갈래))];
  $("#kinds").innerHTML = 갈래들.map(k=>
    `<button data-k="${k}" aria-pressed="true" style="--c:${색(k)};--c-soft:color-mix(in srgb,${색(k)} 12%,transparent)"><i></i>${k}</button>`).join("");
  $("#kinds").addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(!b) return;
    const on = b.getAttribute("aria-pressed")==="true";
    b.setAttribute("aria-pressed", String(!on));
    on ? 갈래끔.add(b.dataset.k) : 갈래끔.delete(b.dataset.k);
    그리기();
  });

  const 이장 = () => GD.단체.filter(t=>t.시기===장 && !갈래끔.has(t.갈래));

  /* ── 장 표지 ── */
  function 표지(것){
    const t = 시기표[장];
    const 사람수 = new Set(것.flatMap(x=>x.사람)).size;
    const 기출 = 것.reduce((a,x)=>a + (x.ㄱ ? x.ㄱ.근 : 0), 0);
    $("#cover").innerHTML = `<div class="no">${t.번호}</div>
      <div><h2>${t.이름}</h2><p>${t.설명} · ${t.부터}~${t.까지}</p></div>
      <div class="nums">
        <div><b>${것.length}</b><small>단체</small></div>
        <div><b>${사람수}</b><small>사람</small></div>
        <div><b>${기출}</b><small>기출(개정 이후)</small></div>
      </div>`;
    $("#prev").disabled = 장들.indexOf(장) === 0;
    $("#next").disabled = 장들.indexOf(장) === 장들.length - 1;
    [...$("#views").children].forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===보기)));
  }

  /* ── 지도 보기 ── */
  function 지도보기(단체들){
    const M = GD.지도, [W,H] = M.뷰;
    const 곳셈 = {};
    단체들.forEach(t=>t.곳.forEach(z=>{ (곳셈[z] = 곳셈[z] || []).push(t); }));
    const 핀 = GD.지역.filter(z=>!z.지도밖 && 곳셈[z.이름]);
    const 표시 = z => {
      const 것 = 곳셈[z.이름] || [];
      const on = 고른곳===z.이름, 흐림 = 고른곳 && !on;
      return `<g class="pin${on?" on":""}${흐림?" dim":""}" data-z="${z.이름}" style="--c:${색(것[0].갈래)}" transform="translate(${z.x},${z.y})">
        <circle r="11"></circle><text class="cnt" text-anchor="middle" dy="4">${것.length}</text>
        <text class="nm" x="${(z.라벨||[16,5])[0]}" dy="${(z.라벨||[16,5])[1]}">${z.이름}${
          z.곁?`<tspan font-size="10.5" fill="var(--ink-4)"> ${z.곁}</tspan>`:""}</text></g>`;
    };
    const 밖 = GD.지역.filter(z=>z.지도밖 && 곳셈[z.이름]);
    const 볼 = 고른곳 ? 단체들.filter(t=>t.곳.includes(고른곳)) : 단체들;
    return `<div class="gd-wrap"><div>
        <div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="근현대 독립운동 지도">
          <g>${M.육지.map(d=>`<path class="land" d="${d}Z"/>`).join("")}</g>
          <g>${M.국경.map(d=>`<path class="border" d="${d}"/>`).join("")}</g>
          <g>${M.해안.map(d=>`<path class="coast" d="${d}"/>`).join("")}</g>
          <g>${핀.map(표시).join("")}</g></svg>
          <div class="legend-m">동그라미 안 숫자 = 이 장에서 이 고장의 단체 수<br>지도 바탕: Natural Earth 50m</div></div>
        <div class="oversea">${밖.length ? `<span style="font:600 12px/1 var(--sans);color:var(--ink-4);align-self:center">바다 건너</span>`
          + 밖.map(z=>`<button data-z="${z.이름}">${z.이름}<small>${z.곁||""} · ${곳셈[z.이름].length}곳</small></button>`).join("") : ""}</div>
      </div>
      <aside class="gd-side"><div class="orgs">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <b style="font:800 15px/1.3 var(--sans);color:var(--ink)">${고른곳 ? 고른곳+" 의 단체" : "이 장의 단체"} ${볼.length}</b>
          ${고른곳 ? `<button id="allz" style="appearance:none;border:0;background:transparent;color:var(--red);font:600 12px/1 var(--sans);cursor:pointer">전체 보기</button>` : ""}
        </div>${볼.map(단체카드).join("")}</div></aside></div>`;
  }

  const 단체카드 = t => `<article class="org${고른단체===t.이름?" on":""}" data-t="${에스(t.이름)}" style="--c:${색(t.갈래)}">
      <h4>${그림(t.갈래)}${에스(t.이름)}<em>${t.해}${t.끝&&t.끝!==t.해?`~${t.끝}`:""}</em>
        ${t.ㄱ?`<span class="qn" data-q="${에스(t.이름)}">${t.ㄱ.근||t.ㄱ.n}</span>`:""}
        ${t.교과서밖?`<span class="out">교과서 밖</span>`:""}</h4>
      <p class="why">${에스(t.한일)}</p>
      ${t.사람.length?`<div class="who">${t.사람.map(얼굴칩).join("")}</div>`:""}
      <div class="src"><b>곳</b> ${t.곳.join(" · ")}${t.근거.쪽수?` &nbsp;·&nbsp; <b>교과서</b> ${t.근거.쪽.slice(0,3).join(" · ")}${t.근거.쪽수>3?` 외 ${t.근거.쪽수-3}곳`:""}`:""}
        ${t.사건.length?`<br><b>연표</b> ${t.사건.slice(0,4).map(e=>`<a href="연표.html?ev=${e.id}" style="color:var(--cta)">${에스(e.이름)}</a>`).join(" · ")}`:""}
        ${t.근거.문장.length?`<br><span style="color:var(--ink-3)">“${에스(t.근거.문장[0].글)}” <em style="font-style:normal">— ${t.근거.문장[0].쪽}</em></span>`:""}
      </div></article>`;

  /* ── 줄기 보기 — 단체가 어떻게 이어졌는가 ── */
  function 줄기보기(단체들){
    const 묶 = {};
    단체들.forEach(t=>{ (묶[t.줄기 || "그 밖"] = 묶[t.줄기 || "그 밖"] || []).push(t); });
    const 전부 = Object.fromEntries(GD.단체.map(t=>[t.이름,t]));
    const 줄 = Object.entries(묶).sort((a,b)=>b[1].length-a[1].length).map(([이름, 것])=>{
      것.sort((a,b)=>a.해-b.해);
      // ⚠ 화살표는 **계승 관계가 실제로 있을 때만** 그린다. 시간순으로 늘어놓고 화살표를 치면
      //   형평사→조선 청년 총동맹 처럼 없는 계보를 만들어 낸다.
      const 마디 = 것.map((t,i)=>`${i ? ((것[i-1].다음||[]).includes(t.이름)
            ? `<span class="arrow">→</span>` : `<span class="arrow sep">·</span>`) : ""}
        <div class="node" data-t="${에스(t.이름)}" style="--c:${색(t.갈래)}">
          <b>${그림(t.갈래)}${에스(t.이름)}</b>
          <div class="meta">${t.해}${t.끝&&t.끝!==t.해?`~${t.끝}`:""} · ${t.곳.join("·")} · ${t.갈래}
            ${t.ㄱ?` <span class="qn" data-q="${에스(t.이름)}">${t.ㄱ.근||t.ㄱ.n}</span>`:""}</div>
          ${t.사람.length?`<div class="faces">${t.사람.map(얼굴알).join("")}</div>`:""}
        </div>`).join("");
      // 이 장을 넘어 이어지는 곳
      const 다음 = [...new Set(것.flatMap(t=>t.다음||[]))].filter(n=>전부[n] && !것.find(x=>x.이름===n));
      const 꼬리 = 다음.length ? `<div class="tail">이 뒤로 이어짐 — ${다음.map(n=>
          `<b>${에스(n)}</b>(${시기표[전부[n].시기].이름})`).join(" · ")}</div>` : "";
      return `<section class="stem" style="--c:${줄기색[이름]||"var(--ink-3)"}">
        <h3><i></i>${에스(이름)}<small>${것.length}곳</small></h3>
        <div class="flow">${마디}</div>${꼬리}</section>`;
    }).join("");
    return `<div class="stems">${줄}</div>`;
  }

  /* ── 인물 보기 ── */
  function 인물보기(단체들){
    // 단체에 속한 사람 + 단체 없이 그 시기에 활동한 사람(안중근·서상돈처럼 혼자 한 이들)
    const 이름들 = [...new Set([...단체들.flatMap(t=>t.사람),
                                ...GD.사람.filter(p=>p.시기===장).map(p=>p.이름)])];
    const 사람 = 이름들.map(n=>사람표[n]).filter(Boolean)
      .sort((a,b)=>((b.ㄱ?b.ㄱ.근:0)-(a.ㄱ?a.ㄱ.근:0)) || (b.얼굴?1:0)-(a.얼굴?1:0));
    if(!사람.length) return `<div class="empty">이 장에는 이름이 붙은 인물이 없습니다.</div>`;
    return `<div class="people">${사람.map(p=>{
      const 속 = p.단체.filter(o=>단체들.find(t=>t.이름===o));
      const 첫단체 = 속.length ? GD.단체.find(x=>x.이름===속[0]) : null;
      const 얼 = p.얼굴 && p.얼굴.length
        ? `<img src="assets/person/${p.얼굴[0].f}" alt="${에스(p.이름)}" loading="lazy">`
        : `<span class="noface" style="--c:${첫단체?색(첫단체.갈래):"var(--ink-4)"}">${실루엣}${첫단체?그림(첫단체.갈래):""}</span>`;
      return `<article class="person">
        <div class="top"><div class="ph">${얼}</div>
          <div><h4>${에스(p.이름)}${p.ㄱ?` <span class="qn" data-q="${에스(p.이름)}">${p.ㄱ.근||p.ㄱ.n}</span>`:""}</h4>
            <div class="one">${에스(p.한줄||"")}</div></div></div>
        <div class="orgs2">${속.map(o=>{const t=GD.단체.find(x=>x.이름===o);
          return `<span style="--c:${색(t.갈래)}" data-t="${에스(o)}">${그림(t.갈래)}${에스(o)}</span>`;}).join("")}</div>
        ${p.얼굴&&p.얼굴.length?`<div class="cap">사진 — ${에스(p.얼굴[0].p)}</div>`
          :`<div class="cap">교과서에 얼굴 사진이 없어 기호로 둡니다.</div>`}
      </article>`;}).join("")}</div>`;
  }

  /* ── 기출 쪽지 ── */
  const 쪽지 = document.createElement("div");
  쪽지.className = "qtip"; 쪽지.hidden = true; document.body.appendChild(쪽지);
  document.addEventListener("mouseover", ev=>{
    const el = ev.target.closest(".qn[data-q]");
    if(!el){ if(!ev.target.closest(".qtip")) 쪽지.hidden = true; return; }
    const t = GD.단체.concat(GD.사람).find(x=>x.이름===el.dataset.q);
    if(!t || !t.ㄱ) return;
    쪽지.innerHTML = `<h5>${에스(t.이름)}<em>${t.ㄱ.근}회 / 전체 ${t.ㄱ.n}회</em></h5>`
      + `<ul>${t.ㄱ.회.map(x=>`<li><b>${x.y} 고${x.g}${x.j?" "+x.j:""} ${x.b}번</b><span>${에스(x.t)}</span></li>`).join("")}</ul>`
      + `<div class="more">2015~2026 학력평가·모의평가·수능 133회분, 문항 해설의 출제의도 기준</div>`;
    쪽지.hidden = false;
    const r = el.getBoundingClientRect(), w = 쪽지.offsetWidth, h = 쪽지.offsetHeight;
    쪽지.style.left = Math.min(Math.max(8, r.left - w + 60), innerWidth - w - 8) + "px";
    쪽지.style.top = (r.bottom + 8 + h > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + "px";
  });
  addEventListener("scroll", ()=>{ 쪽지.hidden = true; }, {passive:true});

  /* ── 손짓 ── */
  document.addEventListener("click", ev=>{
    const z = ev.target.closest("[data-z]");
    if(z){ 고른곳 = (고른곳===z.dataset.z ? null : z.dataset.z); 그리기(); return; }
    if(ev.target.id === "allz"){ 고른곳 = null; 그리기(); return; }
    const t = ev.target.closest("[data-t]");
    if(t){ 고른단체 = (고른단체===t.dataset.t ? null : t.dataset.t); 그리기(); return; }
  });

  function 그리기(){
    const 것 = 이장();
    표지(것);
    $("#stage").innerHTML = 보기==="map" ? 지도보기(것) : 보기==="stem" ? 줄기보기(것) : 인물보기(것);
  }
  그리기();
  옷(document.documentElement.dataset.look || "paper");
})();
</script>
