<!doctype html>
<html lang="ko" data-skin="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기출 — 모두의 한국사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var s=localStorage.getItem("hs-skin")||"white";document.documentElement.dataset.skin=s;document.documentElement.dataset.look=s==="night"?"night":"paper"}catch(e){}</script>
<link rel="stylesheet" href="css/modu.css?v=2bc1ac7c14">
<link rel="stylesheet" href="css/tera-q.css?v=fec71390cc">
<style>
  /* ── 고르기 ── */
  .modes{margin-top:22px}
  .pick{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:22px;align-items:start}
  @media(max-width:980px){.pick{grid-template-columns:1fr}}
  .filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .filt .lab{font-size:14px;font-weight:800;color:var(--ink-4);margin-right:2px}
  .papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .paper{display:block;text-align:left;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:14px 16px;cursor:pointer;transition:border-color .12s}
  .paper:hover{border-color:var(--ink)}
  .paper b{display:block;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .paper span{display:block;font-size:14px;color:var(--ink-4);font-weight:600;margin-top:4px}
  .paper b .recpill{display:inline-flex;margin-top:0;font-size:11.5px;font-weight:800;color:#fff}
  .paper .res{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700;color:var(--ink-3)}
  .paper .res .g{font-family:var(--mono);font-weight:800;color:#fff;background:var(--ink);border-radius:12px;padding:1px 6px}
  .yearh{grid-column:1/-1;font-size:16px;font-weight:800;color:var(--ink);margin:14px 0 2px}
  .yearh:first-child{margin-top:0}
  .eragrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .erab{display:block;text-align:left;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:14px 16px;cursor:pointer}
  .erab:hover{border-color:var(--ink)}
  .erab b{font-size:16px;font-weight:800;color:var(--ink)}
  .erab span{display:block;font-size:14px;color:var(--ink-4);font-weight:600;margin:3px 0 9px}
  .side .card+.card{margin-top:14px}
  .rate{display:grid;grid-template-columns:72px 1fr 64px;gap:10px;align-items:center;font-size:14px;font-weight:700;padding:5px 0}
  .rate em{font-style:normal;font-family:var(--mono);font-weight:800;text-align:right;color:var(--ink-3)}
  .evlist{display:grid;gap:6px}
  .evrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);padding:9px 12px;cursor:pointer;text-align:left;width:100%}
  .evrow:hover{border-color:var(--ink)}
  .evrow b{flex:1;font-size:16px;font-weight:700;color:var(--ink)}
  .evrow .y{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink-4);width:64px}
  .evrow .n{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--red)}

  /* ── 풀기 ── */
  .solve{max-width:860px;margin:0 auto}
  .exbar{position:sticky;top:var(--hh);z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
  .exbar .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .exbar .ttl{font-size:16px;font-weight:800;color:var(--ink)}
  .exbar .tm{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .exbar .tm.warn{color:var(--red)}
  .exbar .pg{margin-left:auto;font-size:14px;color:var(--ink-3);font-weight:700}
  .exbar .pg b{font-family:var(--mono);color:var(--ink)}
  .omr{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:10px}
  .omr button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-4);border-radius:12px;padding:5px 0;cursor:pointer;
    font-family:var(--mono);font-size:14px;font-weight:800;line-height:1.2}
  .omr button[data-done="1"]{background:var(--surface-3);color:var(--ink);border-color:var(--line-3)}
  .omr button[data-s="ok"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .omr button[data-s="no"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
  .omr button.cur{outline:2px solid var(--ink);outline-offset:1px}
  @media(max-width:700px){.omr{grid-template-columns:repeat(10,1fr)}}
  .qc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;scroll-margin-top:calc(var(--hh) + 120px)}
  .qc+.qc{margin-top:18px}
  .qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line)}
  .qh .no{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--ink)}
  .qh .src{font-size:14px;color:var(--ink-4);font-weight:700}
  .qh .sp{flex:1}
  .qimg{padding:18px 18px 8px;background:#fff}
  .qimg img{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
  :root[data-skin="night"] .qimg{border-bottom:1px solid var(--line)}
  .ans{display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap;border-top:1px solid var(--line)}
  .ans button{appearance:none;flex:1;min-width:52px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r1);
    padding:10px 6px;font-size:16px;font-weight:800;cursor:pointer;transition:.12s}
  .ans button:hover{border-color:var(--ink)}
  .ans button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .ans button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .ans button.no{background:var(--red);border-color:var(--red);color:#fff}
  .ans button[disabled]{cursor:default}
  .exp{padding:16px 18px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
  .exp .verdict{font-size:16px;font-weight:800;margin-bottom:8px}
  .exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--red)}
  .exp .intent{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .exp p{font-size:16px;line-height:1.75;color:var(--ink-2);white-space:pre-line}
  .exp .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .exp .ctx{margin-top:12px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);padding:12px 14px}
  .exp .ctx h6{margin:0 0 6px;font-size:14px;font-weight:800;color:var(--ink)}
  .exp .ctx p{font-size:14px;color:var(--ink-3)}
  .exp .ctx p em{font-style:normal;font-weight:800;color:var(--ink-2);margin-right:4px}
  .nextrow{display:flex;gap:10px;justify-content:space-between;margin:18px 0 120px;flex-wrap:wrap}
  .nextrow.stick{position:sticky;bottom:0;z-index:30;margin:14px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,transparent);flex-wrap:nowrap}
  .nextrow.stick .btn{flex:1;justify-content:center}
  .nextrow.stick #prev{flex:0 0 auto}
  @media(max-width:900px){.nextrow.stick{bottom:calc(57px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
  .result{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:22px 24px;margin-bottom:22px}
  .result .big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .result .big b{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.04em}
  .result .big span{font-size:16px;font-weight:800;color:var(--ink-3)}
  .result .big span.grade,.result .grade{font-family:var(--mono);font-size:20px;font-weight:800;color:#fff;background:var(--red);border-radius:12px;padding:3px 10px}
  .result .by{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 18px;margin-top:16px}
  .hide{display:none!important}
  .qimg img{cursor:zoom-in}
  @media(max-width:700px){.qimg{padding:10px 4px 4px}.qh{padding:10px 12px}.ans{padding:12px}.exp{padding:14px 14px 16px}}
  .zoom{position:fixed;inset:0;z-index:90;background:rgba(10,12,16,.86);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:56px 0 40px}
  .zoom img{display:block;width:auto;max-width:none;height:auto;background:#fff;border-radius:12px}
  @media(min-width:701px){.zoom img{width:min(900px,92vw)}}
  @media(max-width:700px){.zoom{justify-content:flex-start}.zoom img{width:165vw}}   /* 폰: 왼쪽부터 읽게, 가로로 밀어 본다 */
  .zoom button{position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:#111;font-size:20px;font-weight:800;cursor:pointer}

  /* ═══ 2026-11-10 화면표준 4절 — 안쪽 머리띠 56 · 진행 막대 4 · 문제 판 18 · 선지 52/14 · 다음 54 아래 고정 ═══ */
  .exbar{display:contents}
  .exbar .in{position:sticky;top:0;z-index:40;height:56px;flex-wrap:nowrap;gap:10px;background:var(--nav-bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 20px}
  @media(min-width:641px){.exbar .in{margin:0}}
  .exbar .bk2{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);padding:0;cursor:pointer}
  .exbar .bk2 svg{width:18px;height:18px}
  .exbar .ttl{flex:1;min-width:0;font-size:16px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exbar .tm{font-size:16px}
  .exbar .pg{margin-left:0;font-size:13px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .exbar .pg b{font-family:inherit;font-weight:700}
  .exbar .btn.sm{height:36px;min-height:36px;border-radius:12px;padding:0 12px;font-size:14px}
  .pbar2{position:sticky;top:56px;z-index:39;height:4px;background:var(--surface-3);margin:0 -16px 16px}
  @media(min-width:641px){.pbar2{margin:0 0 16px}}
  .pbar2 i{display:block;height:100%;width:0;background:var(--pt);transition:width .3s}
  .exbar:has(#timer.hide) .omr{display:none}
  .omr{margin:0 0 16px}
  .omr button{border-radius:12px;border:1.5px solid var(--line-2);padding:7px 0}
  .omr button[data-done="1"]{background:var(--surface-3);border-color:var(--line-2)}
  .omr button[data-s="ok"]{background:color-mix(in srgb,var(--ok-std) 10%,var(--surface));border-color:var(--ok-std);color:var(--ok-std)}
  .omr button[data-s="no"]{background:color-mix(in srgb,var(--no-std) 8%,var(--surface));border-color:var(--no-std);color:var(--no-std)}
  .omr button.cur{outline:2px solid var(--pt);outline-offset:1px}
  #solve{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .qc{border:0;border-radius:18px;box-shadow:0 1px 2px rgba(17,20,25,.05),0 0 0 1px var(--line)}
  .qh{border-bottom:0;padding:16px 18px 6px}
  .qh .src{height:26px;padding:0 10px;border-radius:999px;background:var(--surface-2);display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--ink-3)}
  .qimg{padding:10px 18px 8px}
  .ans{gap:8px;padding:12px 18px 16px;border-top:0}
  .ans button{min-height:52px;border:1.5px solid var(--line-2);border-radius:14px;padding:0 6px;font-size:16px;font-weight:800;background:var(--surface);color:var(--ink)}
  .ans button:hover{border-color:var(--line-3)}
  .ans button[aria-pressed="true"]{background:var(--pt-soft);border-color:var(--pt);color:var(--pt-ink)}
  .ans button.ok{background:color-mix(in srgb,var(--ok-std) 10%,var(--surface));border-color:var(--ok-std);color:var(--ok-std)}
  .ans button.no{background:color-mix(in srgb,var(--no-std) 8%,var(--surface));border-color:var(--no-std);color:var(--no-std)}
  .ans button.ok::before{content:"\2713\00a0"} .ans button.no::before{content:"\2715\00a0"}
  .ans button[disabled]:not(.ok):not(.no){color:var(--ink-4)}
  .exp{margin:0 14px 14px;padding:14px 16px;border-top:0;border-radius:14px;background:var(--surface-2)}
  .exp:has(.verdict.ok){background:color-mix(in srgb,var(--ok-std) 8%,var(--surface))}
  .exp:has(.verdict.no){background:color-mix(in srgb,var(--no-std) 6%,var(--surface))}
  .exp .verdict{font-size:16px;font-weight:800}
  .exp .verdict.ok{color:#0F7B4F} .exp .verdict.no{color:var(--no-std)}
  .exp .ctx{border:0;border-radius:14px}
  .nextrow.stick{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:860px;bottom:0!important;margin:0;
    padding:10px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:45;gap:10px}
  .nextrow.stick .btn{height:54px;min-height:54px;border-radius:14px;font-size:16px}
  .nextrow.stick #prev{flex:0 0 112px;background:var(--surface)}
  .result{border:0;border-radius:18px;box-shadow:0 1px 2px rgba(17,20,25,.05),0 0 0 1px var(--line)}
  .result .grade,.result .big span.grade{background:var(--pt);border-radius:12px}
  .paper .res .g{background:var(--pt-soft);color:var(--pt-ink);border-radius:999px;padding:1px 8px}
  .evrow{border:0;border-radius:14px;box-shadow:0 0 0 1px var(--line)}

  /* ═══ 2026-11-10 문제 화면 공용 부품(tera-q) — 머리 56 · 진행 8px · 번호 줄 · 5지선다 번호 · 해설 탭 · 아래 줄 72 ═══ */
  .solve{max-width:none;padding-bottom:0}
  #solve{padding-bottom:0}
  .exbar{display:block;position:static;top:auto;padding:0;margin:0;border:0;background:none}
  .exbar .in{position:sticky;top:0;height:56px;margin:0;padding:0 16px;background:#fff;border-bottom:0;gap:8px;z-index:41}
  .exbar .bk2{border:0;background:none;width:36px;height:36px;border-radius:0;color:var(--tq-ink)}
  .exbar .bk2 svg{width:20px;height:20px}
  .exbar .ttl{flex:1;font-weight:600;font-size:16px;line-height:20px;color:#14171C;letter-spacing:-.5px}
  .exbar .tm{font-weight:500;font-size:14px;color:var(--tq-sub);font-family:inherit}
  .exbar .tm.warn{color:var(--tq-no)}
  .exbar .pg{display:none}
  .tq-prog u{width:0}
  .tq-prog span b{font-weight:700;color:var(--tq-ink)}
  #solve .tq-wrap{padding-bottom:110px}
  .qc{background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;scroll-margin-top:84px}
  .qc+.qc{margin-top:34px}
  .tq-meta{flex-wrap:wrap;row-gap:6px}
  .tq-no{white-space:nowrap}
  .tq-meta .tag{height:22px;padding:0 8px;border-radius:999px;background:var(--tq-fill);font-size:11.5px;font-weight:600;color:#5F6670;display:inline-flex;align-items:center}
  .tq-meta .src{font-size:13px;font-weight:600;color:#5F6670}
  .qimg{padding:0 0 4px;background:#fff}
  .qimg img{max-width:560px}
  .ans{display:flex;gap:10px;padding:14px 0 6px;border:0;flex-wrap:nowrap;justify-content:space-between}
  .ans button{flex:none;width:44px;min-width:44px;height:44px;min-height:44px;padding:0;border-radius:999px;border:1px solid #9AA0A8;background:#fff;color:var(--tq-ink2);font-size:16px;font-weight:500;line-height:1}
  .ans button:hover{border-color:var(--tq-p)}
  .ans button[aria-pressed="true"]{background:#fff;border-color:var(--tq-p);color:var(--tq-pi);font-weight:700;box-shadow:0 0 0 1px var(--tq-p) inset}
  .ans button.ok{background:color-mix(in srgb,var(--tq-ok) 10%,#fff);border-color:var(--tq-ok);color:var(--tq-ok);font-weight:700}
  .ans button.no{background:color-mix(in srgb,var(--tq-no) 8%,#fff);border-color:var(--tq-no);color:var(--tq-no)}
  .ans button.ok::before,.ans button.no::before{content:none}
  .ans button[disabled]:not(.ok):not(.no){color:#9AA0A8;border-color:#D3D7DD}
  .tq-exp{margin:22px 0 0}
  .tq-exp .verdict{font-size:16px;font-weight:800;margin-bottom:8px}
  .tq-exp .verdict.ok{color:#0F7B4F} .tq-exp .verdict.no{color:var(--tq-no)}
  .tq-exp .intent{font-size:14px;font-weight:800;color:var(--tq-ink);margin-bottom:6px;line-height:1.5}
  .tq-exp p{font-size:16px;line-height:28.8px;color:var(--tq-ink2);white-space:pre-line;margin:0}
  .tq-exp .links{display:flex;gap:8px;flex-wrap:wrap;margin:0}
  .tq-exp .ctx{margin-top:14px;border:1px solid var(--tq-fill);border-radius:12px;background:#F6F7F9;padding:12px 14px}
  .tq-exp .ctx h6{margin:0 0 6px;font-size:14px;font-weight:800;color:var(--tq-ink)}
  .tq-exp .ctx p{font-size:14px;line-height:1.7;color:#4B5159}
  .tq-exp .ctx p em{font-style:normal;font-weight:800;color:var(--tq-ink2);margin-right:4px}
  .tq-omr{background:#fff}
  .tq-omr-row[data-s="ok"] i.is-on{background:var(--tq-ok);color:#fff}
  .tq-omr-row[data-s="no"] i.is-on{background:var(--tq-no);color:#fff}
  .tq-omr .tq-jump{margin-bottom:6px}
  .tq-omr-list{max-height:60vh;overflow:auto}
  #tqbar .tq-pos{cursor:pointer}
  #tqbar{padding-left:8px;padding-right:12px;gap:0}#tqbar .tq-pos{padding:0 6px}#tqbar .tq-nav.is-next{min-width:84px;padding:0 16px}
  .nextrow{display:none}
  #tqbar .tq-nav:not(.is-next){width:44px;min-width:44px;max-width:44px;height:44px;padding:0;border-radius:999px;flex:none}
  #tqbar .tq-tool{width:56px;min-width:56px;height:48px;padding:0}
</style>
</head>
<body>
<header class="nav" id="nav"></header>
<script src="js/shell.js?v=01f12c731d"></script>

<main class="wrap">
  <section id="home">
    <div class="phead">
      <div>
        <span class="kicker"><i></i>기출</span>
        <h1><em>기출</em></h1>
        <p class="sub" id="lead"></p>
      </div>
      <div class="pheadact"><button class="btn" id="quick">아무 시대 10문항</button></div>
    </div>
    <div class="segs modes" id="modes" role="tablist">
      <button data-m="paper" aria-selected="true">모의고사</button>
      <button data-m="era" aria-selected="false">시대별</button>
      <button data-m="ev" aria-selected="false">자주 나온 사건</button>
      <button data-m="wrong" aria-selected="false">복습</button>
    </div>
    <div class="pick">
      <div id="pickbody"></div>
      <aside class="side">
        <div class="card"><div class="hd"><h3>기록</h3><span class="note" id="mytot" style="font-size:14px;color:var(--ink-4);font-weight:700"></span></div>
          <div class="bd" id="myrate"></div></div>
        <div class="card"><div class="bd" style="font-size:14px;color:var(--ink-3);line-height:1.7">
          한국사는 절대평가입니다. 50점 만점에 <b>40점 이상 1등급</b>, 그 아래로 5점마다 한 등급씩 내려갑니다.
          문항은 시험지를 그대로 잘라 실었고 정답과 해설은 각 회차 정답표·해설지를 따랐습니다.</div></div>
      </aside>
    </div>
  </section>

  function 연습끝(){

  /* ═══ 회차 실전 — 20문항, 30분, 채점 ═══ */
  let 시계 = null;

    const qs = 문항.filter(q=>q.p===pid).sort((a,b)=>a.n-b.n);
