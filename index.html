<!doctype html>
<html lang="ko" data-skin="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모두의 한국사</title>
<link rel="stylesheet" href="css/base.css?v=4488879af9">
<link rel="stylesheet" href="css/timeline.css?v=29e76ae56c">
<style>
  .hero{max-width:var(--wrap);margin:0 auto;padding:60px 18px 30px}
  .hero h1{font:900 40px/1.2 var(--kr);letter-spacing:var(--tls);margin:0 0 12px}
  .hero h1 em{color:var(--red);font-style:normal}
  .hero p{color:var(--ink-3);font:400 14px/1.85 var(--kr);max-width:760px;margin:0 0 22px}
  .hero p b{color:var(--ink-2)}
  .keys{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px}
  .keys span{border:1px solid var(--c);background:var(--c-soft);color:var(--ink);
             border-radius:999px;padding:8px 14px;font:800 13px/1 var(--kr)}
  .go{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;
      border-radius:999px;padding:14px 26px;font:800 15px/1 var(--kr);border:0;cursor:pointer}
  .go:hover{background:var(--red-2)}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
        margin:34px 0 0;max-width:var(--wrap)}
  .stat div{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);
            padding:16px}
  .stat b{display:block;font:800 26px/1 var(--mono);color:var(--ink)}
  .stat small{display:block;margin-top:7px;color:var(--ink-4);font:600 11.5px/1.5 var(--kr)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">모두의 <em>한국사</em></div>
  <div class="spacer"></div>
  <a class="chip" href="연표.html" style="--c:var(--red);--c-soft:var(--red-soft)" aria-pressed="true"><i></i>연표</a>
</div></header>

<section class="hero">
  <h1>한국사를 <em>한 장의 연대표</em>로</h1>
  <p>정치·대외·경제·사회·문화를 따로 외우지 않는다. <b>다섯 빛깔로 갈라 한 연대표에 얹어</b>
     같은 시대에 무엇이 함께 일어났는지를 눈으로 잡는다.
     바탕은 <b>미래엔 2022개정 한국사1·한국사2</b> 실물이고,
     분야는 <b>교과서가 그 사건을 어느 소단원에서 다루는지</b>로 정했다.</p>
  <div class="keys">
    <span style="--c:var(--f-정치);--c-soft:var(--f-정치-soft)">정치</span>
    <span style="--c:var(--f-대외);--c-soft:var(--f-대외-soft)">대외</span>
    <span style="--c:var(--f-경제);--c-soft:var(--f-경제-soft)">경제</span>
    <span style="--c:var(--f-사회);--c-soft:var(--f-사회-soft)">사회</span>
    <span style="--c:var(--f-문화);--c-soft:var(--f-문화-soft)">문화</span>
  </div>
  <a class="go" href="연표.html">연표 보러 가기 →</a>
  <div class="stat" id="stat"></div>
</section>

<script src="js/timeline.js?v=b7377c7d97"></script>
<script>
  const ko = TL.사건.filter(e=>e.계열==="한국사");
  const 세 = TL.사건.length - ko.length;
  const 시대수 = new Set(ko.map(e=>e.시대)).size;
  document.getElementById("stat").innerHTML = [
    [ko.length, "한국사 사건"], [세, "세계사 사건(대조)"], [시대수, "시대"],
    [5, "분야 빛깔"], ["166+160", "교과서 지면(한국사1·2)"],
  ].map(([n,t])=>`<div><b>${n}</b><small>${t}</small></div>`).join("");
</script>
</body>
</html>
